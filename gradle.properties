
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Room 2.7.x supports KSP2, which Kotlin 2.0 enables by default. Forcing KSP1
# made Room's generated AppDatabase_Impl resolve to error.NonExistentClass and
# cascaded into Hilt binding failures, so KSP2 stays on.
