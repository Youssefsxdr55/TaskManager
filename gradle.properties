
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Kotlin 2.0 enables the KSP2 symbol-processing implementation by default, which
# Room 2.6.1 does not support: its annotation reader fails with
# "KSErrorType cannot be cast to KSAnnotation" while extracting foreign keys.
# Staying on KSP1 until Room ships KSP2 support.
ksp.useKSP2=false
