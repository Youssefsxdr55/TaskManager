
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Stay on KSP1. Kotlin 2.0 enables KSP2 by default, but Room 2.6.1 and Dagger
# 2.52 cannot resolve types across KSP rounds in KSP2: every Hilt binding in
# AppModule fails with error.NonExistentClass. The stable combination is
# KSP1 + Room 2.6.1 + Dagger 2.52.
ksp.useKSP2=false
